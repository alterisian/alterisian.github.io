<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Coses De l’Estació</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f7;--fg:#1c1917;--mut:#78716c;--card:#fff;--line:#e9e5e0;--acc:#ea580c;--c-food:#FF7F00;--c-bar:#8E44AD;--c-shop:#00A6D6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141210;--fg:#f5f2ee;--mut:#a8a29e;--card:#1d1a17;--line:#2f2a26;--acc:#fb7a2f;--c-food:#FF7F00;--c-bar:#8E44AD;--c-shop:#00A6D6}}
:root[data-theme=dark]{--bg:#141210;--fg:#f5f2ee;--mut:#a8a29e;--card:#1d1a17;--line:#2f2a26;--acc:#fb7a2f;--c-food:#FF7F00;--c-bar:#8E44AD;--c-shop:#00A6D6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Montserrat","Gotham","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.015em}header p{margin:0;color:var(--mut);font-size:13px;flex-basis:100%;order:3}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--acc);border-radius:999px;padding:3px 10px}
main{display:flex;align-items:flex-start;min-height:calc(100vh - 90px)}
#list{width:260px;flex:none;border-right:1px solid var(--line);padding:16px 0}
.rail{position:relative;padding:4px 16px 4px 0}
.rail:before{content:"";position:absolute;left:20px;top:22px;bottom:34px;width:4px;background:var(--acc);border-radius:2px}
.st{display:block;width:calc(100% - 46px);margin:0 0 16px 46px;text-align:left;background:none;border:1.5px dashed color-mix(in srgb,var(--mut) 55%,transparent);border-radius:10px;color:inherit;font:inherit;padding:9px 12px;position:relative;cursor:pointer}
.st:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.st:after{content:"";position:absolute;left:-35px;top:12px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--acc)}
.st.sel{font-weight:600;background:color-mix(in srgb,var(--acc) 8%,transparent);border-style:solid;border-color:var(--acc)}.st.sel:after{background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.lns{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;min-height:22px}
.ln{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:3px;font-style:normal;font-size:10px;font-weight:700;line-height:1}
.near{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:0 7px}
.dist{display:block;font-size:12px;color:var(--mut);font-weight:400}
#right{flex:1;padding:24px 28px;min-width:0;position:sticky;top:0;align-self:flex-start}h2{margin:0 0 2px;font-size:26px;font-weight:650;letter-spacing:-.02em}.sub{color:var(--mut);margin:0 0 20px;font-size:14px}
#boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2%;max-width:720px;width:100%}
.box{--t:var(--acc);container-type:inline-size;min-width:0;min-height:0;width:100%;overflow:hidden;aspect-ratio:1/1;border:1px solid transparent;border-radius:16px;background:var(--t);padding:7%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:#fff;font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.box[data-c=Food]{--t:var(--c-food)}.box[data-c=Bar]{--t:var(--c-bar)}.box[data-c=Shop]{--t:var(--c-shop)}
.box:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px color-mix(in srgb,var(--t) 45%,transparent)}
.box.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--t)}
.box.empty{border:1px dashed var(--line);background:transparent;cursor:default;color:var(--mut);box-shadow:none;transform:none;font-size:clamp(10px,6.4cqw,13px)}
.cat{display:inline-block;max-width:100%;font-size:clamp(8px,5.2cqw,10.5px);text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:#fff;background:rgba(255,255,255,.24);border-radius:3px;padding:4px 8px}
.box.empty .cat{background:none;padding:0;color:var(--mut)}
.nm{font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.18);font-size:clamp(10px,7.8cqw,15px);line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rt{font-size:clamp(10px,6.2cqw,13px);line-height:1.3;color:rgba(255,255,255,.94)}.rt b{color:#fff}
#detail{--t:var(--acc);max-width:720px;margin-top:16px;border-radius:14px;padding:16px 18px;background:var(--t);color:#fff;display:none}
#detail[data-c=Food]{--t:var(--c-food)}#detail[data-c=Bar]{--t:var(--c-bar)}#detail[data-c=Shop]{--t:var(--c-shop)}
#detail p{margin:8px 0}#detail .rt,#detail .rt b{color:#fff}#detail a{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px}
#status{font-size:12px;color:var(--mut);margin-top:14px;max-width:720px}
@media(max-width:640px){main{flex-direction:column;align-items:stretch}#list{width:100%;border-right:0}#right{position:sticky;bottom:0;top:auto;align-self:stretch;z-index:5;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 20px -12px rgba(0,0,0,.25);padding:12px 16px;max-height:62vh;overflow-y:auto}h2{font-size:19px}.sub{font-size:12px;margin:0 0 10px}.box{border-radius:12px}#detail{margin-top:10px}}
</style></head><body>

const CAT=["Food","Bar","Shop"];
const LC={L1:"#E30613",L2:"#8E44AD",L3:"#009E49",L4:"#FFD100",L5:"#0066CC",L6:"#8B7DBE",L7:"#8B5E3C",L8:"#E5007D",L9:"#FF7F00",L10:"#00A6D6",L11:"#8CC63E",FM:"#9aa0a6"};
const bd=m=>(m||[]).map(l=>`<i class="ln" style="background:${LC[l]};color:${l=="L4"?"#222":"#fff"}">${l}</i>`).join("");
const $=id=>document.getElementById(id);
function dist(a,b,c,d){const R=6371000,x=Math.PI/180,dl=(c-a)*x,dn=(d-b)*x,h=Math.sin(dl/2)**2+Math.cos(a*x)*Math.cos(c*x)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const walk=m=>Math.max(1,Math.round(m*1.3/80));
let cur=0,near=-1,me=null;
function renderList(){$("list").innerHTML='<div class="rail">'+S.map((s,i)=>`<button class="st${i==cur?" sel":""}" data-i="${i}">${s.n}${i==near?'<span class="near">nearest</span>':""}<span class="lns">${bd(s.m)}</span>${me?`<span class="dist">${(dist(me[0],me[1],s.la,s.lo)/1000).toFixed(1)} km away</span>`:""}</button>`).join("")+"</div>";
 document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;renderList();renderBoxes()})}
function renderBoxes(){const s=S[cur];$("t").textContent=s.n;$("s").innerHTML="Good places that deserve more attention"+(s.m?`<br><span style="display:inline-block;margin-top:8px">Metro connections</span><span class="lns">${bd(s.m)}</span>`:"")+(s.x?`<br><span style="color:var(--acc);font-weight:600">S1/S2 trains skip this stop (L6 only).</span>`:"");$("detail").style.display="none";
 $("boxes").innerHTML=CAT.map((c,i)=>{const p=s.p[i];
  if(!p)return`<div class="box empty"><span class="cat">${c}</span><span>${s.p.length?"Nothing qualifying found yet":"Not searched yet"}</span></div>`;
  return`<button class="box" data-c="${c}" data-i="${i}"><span class="cat">${c}</span><span class="nm">${p.n}</span><span class="rt"><b>★ ${p.r}</b> · ${p.k} reviews<br>${walk(dist(s.la,s.lo,p.la,p.lo))} min walk</span></button>`}).join("");
 document.querySelectorAll(".box:not(.empty)").forEach(b=>b.onclick=()=>{document.querySelectorAll(".box").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");
  const p=s.p[+b.dataset.i],d=$("detail");d.style.display="block";d.dataset.c=p.c;
  d.innerHTML=`<b>${p.n}</b> <span class="cat">${p.c}</span><p>${p.d}</p><p class="rt"><b>★ ${p.r}</b> from ${p.k} reviews · about ${walk(dist(s.la,s.lo,p.la,p.lo))} min on foot from ${s.n}</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(s.n+" FGC station, Catalonia")}&destination=${encodeURIComponent(p.n)}&destination_place_id=${p.id}&travelmode=walking">Walk it from ${s.n} →</a> &nbsp;·&nbsp; <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.n)}&query_place_id=${p.id}">View place</a>`})}
function locate(){try{if(!navigator.geolocation)throw 0;navigator.geolocation.getCurrentPosition(pos=>{me=[pos.coords.latitude,pos.coords.longitude];
 let b=1e12;S.forEach((s,i)=>{const d=dist(me[0],me[1],s.la,s.lo);if(d<b){b=d;near=i}});cur=near;$("status").textContent="Nearest station: "+S[near].n+" ("+(b/1000).toFixed(1)+" km).";renderList();renderBoxes();const e=document.querySelector(".st.sel");if(e)e.scrollIntoView({block:"center",behavior:"smooth"})},
 ()=>{$("status").textContent="Couldn't get your location (permission denied or blocked here). Pick a station on the left."},{timeout:8000})}catch(e){$("status").textContent="Location isn't available in this browser."}}
renderList();renderBoxes();locate();
